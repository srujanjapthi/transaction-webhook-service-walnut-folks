name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -euo pipefail

          cd /opt/transaction-webhook-service

          echo "Authenticating with Amazon ECR..."

          aws ecr get-login-password --region ap-south-1 \
            | docker login \
                --username AWS \
                --password-stdin \
                000540852340.dkr.ecr.ap-south-1.amazonaws.com

          echo "Pulling latest application image..."

          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            pull

          echo "Restarting application..."

          docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            up -d --remove-orphans

          echo "Checking application health..."

          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Deployment successful. Application is healthy."
              exit 0
            fi

            echo "Waiting for application to become healthy... ($attempt/12)"
            sleep 5
          done

          echo "Application health check failed."
          docker logs --tail 100 transaction-webhook-service
          exit 1
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy transaction-webhook-service" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          echo "Deployment command completed."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
